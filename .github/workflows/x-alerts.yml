# Checks the X accounts in WATCH_ACCOUNTS about every 5 minutes and posts new ones to the 企业微信 group.
name: x-alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; real runs are usually 5-15 min apart
  workflow_dispatch:
    inputs:
      test:
        description: "Also send a test message to the group"
        type: boolean
        default: true

permissions:
  contents: write   # only for the keep-alive commit at the bottom

concurrency:
  group: x-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
      TW_AUTH_TOKEN: ${{ secrets.TW_AUTH_TOKEN }}
      TW_CT0: ${{ secrets.TW_CT0 }}
      WATCH_ACCOUNTS: ${{ secrets.WATCH_ACCOUNTS }}
      WATCH_LIST_ID: ${{ secrets.WATCH_LIST_ID }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      INCLUDE_RETWEETS: ${{ vars.INCLUDE_RETWEETS }}
      INCLUDE_REPLIES: ${{ vars.INCLUDE_REPLIES }}
      INCLUDE_QUOTES: ${{ vars.INCLUDE_QUOTES }}
      KEYWORDS: ${{ vars.KEYWORDS }}
      EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
      SEND_IMAGES: ${{ vars.SEND_IMAGES }}
      WECOM_MENTION_ALL: ${{ vars.WECOM_MENTION_ALL }}
      HEARTBEAT_HOUR: ${{ vars.HEARTBEAT_HOUR }}
      LOOP_MINUTES: ${{ vars.LOOP_MINUTES }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -U -r requirements.txt
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: x-alerts-state-${{ github.run_id }}
          restore-keys: x-alerts-state-
      - name: Test
        if: github.event_name == 'workflow_dispatch' && inputs.test
        run: python xalerts.py --test
      - name: Check for new posts
        run: python xalerts.py
      - name: Save state
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: x-alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
      # GitHub pauses schedules in public repos after 60 days without activity; commit a tiny file every ~40 days.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .keepalive && git add .keepalive && git commit -q -m keepalive && git push -q
          fi
